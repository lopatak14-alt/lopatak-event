
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOPATAK EVENT STORE</title>
<style>
body {
  margin: 0;
  background: #101810;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  background: #193c24;
  padding: 35px 15px;
}
h1 { color: #65ff85; font-size: 38px; }
p { color: #ccc; }
.shop {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  padding: 30px 15px;
}
.card {
  background: #1d2b20;
  border: 2px solid #3b7848;
  border-radius: 15px;
  padding: 25px;
  width: 220px;
}
.price {
  font-size: 28px;
  color: #65ff85;
}
button {
  background: #65ff85;
  color: #101810;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}
input {
  padding: 12px;
  border-radius: 8px;
  border: none;
  margin: 8px;
}
footer { padding: 25px; color: #aaa; }
</style>
</head>
<body>

<header>
<h1>LOPATAK EVENT</h1>
<h2>OFFICIAL MINECRAFT STORE</h2>
<p>Vítej v našem Minecraft shopu!</p>
<p>IP: malls-aided.tun.ply.gg</p>
</header>

<h2>NAŠE RANKY</h2>

<div class="shop">
<div class="card">
<h2 style="color:gold">VIP</h2>
<div class="price">49 Kč</div>
<p>Základní VIP rank</p>
<button onclick="selectRank('VIP',49)">Koupit</button>
</div>

<div class="card">
<h2 style="color:#55aaff">PREMIUM</h2>
<div class="price">99 Kč</div>
<p>Prémiový rank</p>
<button onclick="selectRank('PREMIUM',99)">Koupit</button>
</div>

<div class="card">
<h2 style="color:#ce85ff">LEGEND</h2>
<div class="price">199 Kč</div>
<p>Legendární rank</p>
<button onclick="selectRank('LEGEND',199)">Koupit</button>
</div>
</div>

<h2>OBJEDNÁVKA</h2>
<p>Zadej svůj Minecraft nick:</p>
<input id="nick" placeholder="Minecraft nick">
<p id="selected">Nejdříve vyber rank.</p>
<button onclick="order()">Pokračovat</button>

<p id="message"></p>

<footer>
LOPATAK EVENT STORE © 2026
</footer>

<script>
let rank = "";
let price = 0;

function selectRank(name, amount) {
  rank = name;
  price = amount;
  document.getElementById("selected").innerText =
    rank + " – " + price + " Kč";
}

function order() {
  let nick = document.getElementById("nick").value.trim();

  if (!rank) {
    alert("Nejdříve vyber rank!");
    return;
  }

  if (!/^[A-Za-z0-9_]{3,16}$/.test(nick)) {
    alert("Zadej platný Minecraft nick!");
    return;
  }

  document.getElementById("message").innerText =
    "Objednávka připravena: " + rank +
    " pro hráče " + nick +
    ". Kontaktuj administrátora pro dokončení platby.";
}
</script>

</body>
</html>
